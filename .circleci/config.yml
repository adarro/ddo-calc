# Scala CircleCI 2.0 configuration file
# See: https://circleci.com/docs/2.0/sample-config/
version: 2.1
orbs:
    gradle: circleci/gradle@3.0.0
    codecov: codecov/codecov@3.2.5
    coverage-reporter: codacy/coverage-reporter@13.13.7
# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/2.0/configuration-reference/#jobs
jobs:
    build_and_test:
        # Specify the execution environment. You can specify an image from Dockerhub or use one of our Convenience Images from CircleCI's Developer Hub.
        # See: https://circleci.com/docs/2.0/configuration-reference/#docker-machine-macos-windows-executor
        docker:
            # specify the version you desire here
            - image: cimg/openjdk:21.0
              auth:
                  username: $docker_user
                  password: $docker_token

            # Specify service dependencies here if necessary
            # CircleCI maintains a library of pre-built images
            # documented at https://circleci.com/docs/2.0/circleci-images/
            # - image: circleci/postgres:9.4

        resource_class: large

        working_directory: ~/repo

        environment:
            # Customize the JVM maximum heap limit
            JVM_OPTS: -Xmx3200m
            TERM: dumb

        # Add steps to the job
        # See: https://circleci.com/docs/2.0/configuration-reference/#steps
        steps:
            - run:
                  name: Checkout code
                  command: |
                      git clone --depth 50 --branch "$CIRCLE_BRANCH" \
                          "https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git" .
                      git checkout "$CIRCLE_SHA1"
                      git fetch origin +refs/heads/master:refs/remotes/origin/master
            - restore_cache:
                  keys:
                      - v1-dependencies-{{ checksum "gradle/libs.versions.toml" }}
                      # fallback to using the latest cache if no exact match is found
                      - v1-dependencies-
            - run: ./gradlew assemble
            - run: if [ -e ./gradlew ]; then ./gradlew check reportScoverage aggregateScoverageTestReporting aggregateAcceptanceTestReporting aggregateTestReporting --no-configuration-cache --continue;else gradle check reportScoverage aggregateScoverageTestReporting aggregateAcceptanceTestReporting aggregateTestReporting --no-configuration-cache --continue;fi
            - save_cache:
                  paths:
                      - ~/.gradle
                  key: v1-dependencies-{{ checksum "gradle/libs.versions.toml" }}
            # 2. Upload the aggregated XML files to the CircleCI "Tests" tab
            # You can pass the parent directory to upload both suites at once
            - store_test_results:
                  path: subprojects/*/build/test-results
            - store_artifacts:
                  path: subprojects/common/ddo-test-results/build/reports/tests/test/aggregated-results
                  destination: unit-test-html-report
            - store_artifacts:
                  path: subprojects/common/ddo-test-results/build/reports/tests/acceptanceTest/aggregated-results
                  destination: acceptance-test-html-report
            - codecov/upload
workflows:
    example-workflow:
        jobs:
            - build_and_test:
                  context:
                      - docker_creds
            # run tests!
