version: 0.1
cli:
    version: 1.25.0

plugins:
    sources:
        - id: trunk
          ref: v1.11.0
          uri: https://github.com/trunk-io/plugins
lint:
    enabled:
        - grype@0.119.0
        - pinact@5.0.0
        - svgo@4.1.0
        - hadolint@2.15.1
        - terrascan@1.19.9
        - checkov@3.3.19
        - osv-scanner@2.6.0
        - trivy@0.74.0
        - trufflehog@3.97.5
        - taplo@0.10.0
        - actionlint@1.7.12
        - dotenv-linter@4.0.0
        - git-diff-check
        - gitleaks@8.30.1
        - ktlint@1.8.0
        - markdownlint@0.49.1
        - oxipng@10.2.1
        - prettier@3.9.8
        - renovate@44.103.6
        - scalafmt@3.11.5
        - shellcheck@0.11.0
        - shfmt@3.14.1
        - yamllint@1.38.0
    ignore:
        - linters: [ALL]
          paths:
              - incubating/**
              - "**/gradlew"
runtimes:
    enabled:
        - go@1.21.0
        - java@13.0.11
        - node@22.16.0
        - python@3.14.4
actions:
    disabled:
        - trunk-check-pre-commit
        - trunk-announce
        - trunk-check-pre-push
        - trunk-fmt-pre-commit
    enabled:
        - trunk-upgrade-available
